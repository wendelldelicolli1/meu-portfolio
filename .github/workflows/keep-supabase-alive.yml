# Mantém o projeto Supabase gratuito ativo (ele pausa após ~1 semana sem uso).
# Faz uma leitura pública de 1 linha na tabela "projects" a cada 3 dias.
# URL e chave pública (anon) vêm de assets/config.js, então ficam sempre em sincronia.
name: Keep Supabase alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' assets/config.js | head -1)
          KEY=$(grep -o 'eyJ[A-Za-z0-9_.-]*' assets/config.js | head -1)
          test -n "$URL" && test -n "$KEY"
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            "$URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondeu HTTP $code"
          test "$code" = "200"
